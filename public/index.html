	background: transparent;
}

}

	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}

	touch-action: none;

}

	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}

	}

	visibility: inherit;

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {

	height: 1px;
	}
.lvml {

	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;

	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;

	will-change: transform;

.leaflet-zoom-anim .leaflet-zoom-animated {

	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

.leaflet-container {

	font-size: 0.75rem;

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;

	display: block;
	text-align: center;
	text-decoration: none;
	color: black;

	background-position: 50% 50%;

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;

	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {

.leaflet-touch .leaflet-bar a:last-child {

	border-bottom-right-radius: 2px;
	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);

/* attribution and scale controls */

	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;

.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	margin-left: -6px;

	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

.leaflet-tooltip-left:before {

.leaflet-tooltip-right:before {

	border-right-color: #fff;

.badge-item { display:flex; align-items:center; gap:6px; font-size:12.5px; }
.badge-item.locked { opacity:.38; filter:grayscale(1); }
.badge-item b { font-weight:600; }
/* 天气背景联动（固定层，整页轻微氛围） */
body.wx-rain::after, body.wx-sunny::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:6;
}
body.wx-rain::after {
  background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(120,160,220,.07) 14px 15px);
  animation:rainMove .6s linear infinite;
}
@keyframes rainMove { to { background-position:60px 90px; } }
body.wx-sunny::after {
  background:radial-gradient(circle at 78% 8%, rgba(255,214,112,.16), transparent 55%);
}
/* 桌宠彩蛋动画 */
#pet.egg .pet-body { animation:eggDance .8s ease-in-out 2; }
@keyframes eggDance {
  0%,100% { transform:rotate(0) scale(1); }
  25% { transform:rotate(-14deg) scale(1.1); }
  75% { transform:rotate(14deg) scale(1.1); }
}

<style>
:root {
  --brand: #4a8cff;
  --brand-hover: #2f78ef;
  --bg: #eaf3ff;
  --border: #d9e8fb;
  --text: #1f2937;
  --text-dim: #6b7c93;
  --user-bubble: #e7f1ff;
  --card: #ffffff;
  --shadow: 0 6px 24px rgba(74, 140, 255, 0.12);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
  width: 100%;
}

/* ── 侧边栏 ───────────────────────────── */
.sidebar {
  width: 240px;
  flex: 0 0 240px;
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: width .25s ease, flex-basis .25s ease, padding .25s ease;
  overflow: hidden;
}
.sidebar.collapsed { width: 0; flex-basis: 0; padding: 0; }

.logo { font-size: 20px; font-weight: 700; color: var(--brand); padding: 0 6px 6px; }
.logo span { color: var(--text); }

.new-chat {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
}
.new-chat:hover { border-color: var(--brand); color: var(--brand); }

.side-title { font-size: 12px; color: var(--text-dim); padding: 8px 6px 2px; }

.history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.history-item {
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  gap: 8px;
  align-items: center;
}
.history-item:hover { background: rgba(74, 140, 255, .10); }
.history-item.active { background: rgba(74, 140, 255, .16); font-weight: 600; }
.history-item .dot { color: var(--brand); font-size: 10px; flex: 0 0 auto; }
.history-empty { color: var(--text-dim); font-size: 13px; padding: 10px 8px; }

.side-tip { font-size: 11px; color: var(--text-dim); line-height: 1.6; padding: 8px 6px; }

/* ── 主区域 ───────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

.topbar {
  height: 52px;
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
}
.title { font-size: 16px; font-weight: 700; color: var(--brand); }
.title span { color: var(--text-dim); font-weight: 500; font-size: 13px; }
.icon-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-dim);
  border-radius: 8px;
  width: 32px; height: 32px;
  cursor: pointer;
  font-size: 14px;
  flex: 0 0 auto;
}
.icon-btn:hover { color: var(--brand); border-color: var(--brand); }
.map-toggle { margin-left: auto; }

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 8px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.welcome {
  max-width: 640px;
  margin: 8vh auto 0;
  text-align: center;
  padding: 0 12px;
}
.welcome-title { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
.welcome-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 26px; }
.welcome-examples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.example {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 12px;
  padding: 14px;
  font-size: 13.5px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(74, 140, 255, .05);
  transition: all .15s;
}
.example:hover { border-color: var(--brand); transform: translateY(-1px); box-shadow: var(--shadow); }

.msg { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
.msg .avatar {
  width: 32px; height: 32px; flex: 0 0 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  background: var(--card);
  border: 1px solid var(--border);
}
.msg .bubble {
  padding: 12px 15px;
  border-radius: 14px;
  font-size: 14.5px;
  line-height: 1.75;
  word-break: break-word;
  white-space: normal;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble {
  background: var(--user-bubble);
  border: 1px solid var(--border);
  border-bottom-right-radius: 4px;
}
.msg.bot .bubble {
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 10px rgba(74, 140, 255, .06);
}
.msg .bubble p { margin: 0 0 6px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble strong { color: #1657c4; }
.msg .bubble ul { margin: 4px 0 6px; padding-left: 20px; }
.msg .bubble li { margin: 2px 0; }
.msg .bubble img { max-width: 220px; border-radius: 10px; display: block; margin-bottom: 6px; }

.typing span {
  display: inline-block; width: 6px; height: 6px; margin-right: 4px;
  background: var(--brand); border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ── 输入区 ───────────────────────────── */
.composer { flex: 0 0 auto; padding: 8px 18px 14px; }
.composer-inner {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 8px 8px 10px;
  box-shadow: var(--shadow);
}
#input {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  font-size: 14.5px;
  font-family: inherit;
  line-height: 1.6;
  max-height: 160px;
  padding: 7px 4px;
  background: transparent;
  color: var(--text);
}
.tool-btn {
  border: none;
  background: transparent;
  font-size: 19px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  flex: 0 0 auto;
}
.tool-btn:hover { background: var(--user-bubble); }
.send-btn {
  border: none;
  background: var(--brand);
  color: #fff;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 14px;
  cursor: pointer;
  flex: 0 0 auto;
  transition: background .15s;
}
.send-btn:hover { background: var(--brand-hover); }
.send-btn:disabled { opacity: .55; cursor: not-allowed; }

.attach-preview {
  max-width: 860px;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.attach-preview img {
  height: 54px; border-radius: 8px; border: 1px solid var(--border);
}
.attach-preview button {
  border: 1px solid var(--border); background: #fff; border-radius: 50%;
  width: 22px; height: 22px; cursor: pointer; color: var(--text-dim); font-size: 11px;
}

/* ── 地图面板 ─────────────────────────── */
.map-panel {
  width: 360px;
  flex: 0 0 360px;
  border-left: 1px solid var(--border);
  background: rgba(255, 255, 255, .55);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: width .25s ease, flex-basis .25s ease;
  overflow: hidden;
}
.map-panel.hidden { width: 0; flex-basis: 0; border-left: none; }
.map-head {
  height: 52px; flex: 0 0 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.map-body { flex: 1; overflow-y: auto; padding: 0 14px 18px; }
.map-empty { color: var(--text-dim); font-size: 13px; line-height: 1.8; padding: 12px 0; }
.map-count { font-size: 11.5px; color: var(--text-dim); margin: 0 0 8px; }

/* 地图画布（Leaflet + 高德瓦片） */
.map-canvas-wrap { margin-bottom: 12px; }
.map-canvas {
  width: 100%;
  height: 240px;
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: #eef4fb;
  z-index: 0;
}
.map-canvas .leaflet-container { font-family: inherit; }
.poi-marker-wrap { background: transparent; border: none; }
.poi-marker {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--c, #4a8cff);
  color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(31, 41, 55, .30);
  transition: transform .15s ease, box-shadow .15s ease;
  cursor: pointer;
}
.poi-marker.active {
  transform: scale(1.28);
  box-shadow: 0 0 0 4px rgba(74, 140, 255, .35), 0 2px 10px rgba(31, 41, 55, .32);
}
.leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; line-height: 1.6; }
.leaflet-popup-content b { font-size: 13px; }
.poi-popup div { color: var(--text-dim); margin-top: 2px; }

.poi-card {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.poi-card:hover { border-color: #b9d4f7; }
.poi-card.active {
  border-color: var(--brand);
  box-shadow: 0 4px 14px rgba(74, 140, 255, .18);
}
.poi-pin {
  flex: 0 0 auto;
  color: #fff;
  font-size: 11px;
  border-radius: 6px;
  padding: 2px 6px;
  margin-top: 1px;
}
.poi-info { flex: 1; min-width: 0; }
.poi-name { font-size: 13.5px; font-weight: 600; }
.poi-addr { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.poi-links { display: flex; gap: 6px; margin-top: 7px; }
.poi-links a {
  font-size: 11.5px; color: var(--brand); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; white-space: nowrap;
}
.poi-links a:hover { border-color: var(--brand); background: var(--user-bubble); }

/* ── 移动端 ───────────────────────────── */
@media (max-width: 960px) {
  .map-panel {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: 86vw; flex-basis: auto; z-index: 30;
    box-shadow: -6px 0 24px rgba(31, 41, 55, .12);
    background: #f7fbff;
  }
  .map-panel.hidden { transform: translateX(102%); width: 86vw; flex-basis: auto; border-left: 1px solid var(--border); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; background: #f7fbff; box-shadow: 6px 0 24px rgba(31,41,55,.12); }
  .sidebar.collapsed { transform: translateX(-102%); width: 240px; flex-basis: 240px; padding: 18px 12px; }
  .welcome-examples { grid-template-columns: 1fr; }
  .welcome { margin-top: 4vh; }
}

/* 语音输入录音中 */
.tool-btn.recording {
  background: #ff5a5a;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* 收藏夹 */
.poi-card { position: relative; }
.fav-btn {
  position: absolute; top: 10px; right: 10px;
  border: none; background: transparent; cursor: pointer;
  font-size: 16px; line-height: 1; padding: 4px; border-radius: 6px;
  transition: transform .15s ease;
}
.fav-btn:hover { transform: scale(1.25); background: rgba(0,0,0,.05); }
.fav-item { display: flex; align-items: center; gap: 6px; }
.fav-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-del {
  border: none; background: transparent; color: #b0b8c4;
  cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px;
}
.fav-del:hover { color: #ff5a5a; background: rgba(0,0,0,.06); }

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-avatar"></span> <span>小水</span></div>
    <button class="new-chat" id="newChat">＋ 新对话</button>
    <div class="side-title">🛒 购物清单 <button class="list-add" id="listAdd" title="添加">＋</button></div>
    <div class="history" id="listList"></div>
    <div class="side-title">🏅 成就</div>
    <div class="history" id="badgeList"></div>
    <div class="side-title">我的收藏</div>
    <div class="history" id="favList"></div>
    <div class="side-title">最近对话</div>
    <div class="history" id="historyList"></div>
    <div class="side-tip">问商场、找酒店、认景点<br />发张照片我就能告诉你这是哪儿</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sideToggle" title="切换侧边栏">☰</button>
      <div class="title">小水 <span>出行决策助手</span></div>
      <button class="icon-btn" id="themeToggle" title="深色/浅色模式">🌙</button>
      <button class="icon-btn" id="shareBtn" title="生成分享卡片">🖼️</button>
      <button class="icon-btn map-toggle" id="mapToggle" title="位置地图">📍</button>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-title">有什么我能帮你的吗？</div>
        <div class="welcome-sub">找商场 · 挑酒店 · 认景点 · 规划玩法</div>
        <div class="welcome-examples">
          <button class="example" data-text="北京有什么好逛的商场？我喜欢高端品牌">💎 北京有什么好逛的商场？</button>
          <button class="example" data-text="上海外滩附近性价比高的酒店推荐">🏨 上海外滩附近性价比酒店</button>
          <button class="example" data-text="成都两天怎么玩？帮我推荐景点">✈️ 成都两天怎么玩？</button>
        <button class="example" data-text="我想买个相机，5000以内，帮我推荐去哪买">🛍️ 想买个相机，5000以内</button>
          <button class="example" data-text="我想买个相机，5000以内，帮我推荐去哪买">🛍️ 想买个相机，5000以内</button>
          <button class="example" id="examplePhoto">📷 上传照片，帮我认认这是哪儿</button>
        </div>
      </div>
    </section>

    <style id="extraCss">
.quickbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 6px;max-width:860px;margin:0 auto}
.quickbar button{border:1px solid #dbe4ef;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:#3a4a5e;cursor:pointer;transition:all .15s}
.quickbar button:hover{background:#eaf3ff;border-color:#9cc4f5;transform:translateY(-1px)}
body.dark .quickbar button{background:#253241;border-color:#3a4a5e;color:#cdd8e6}
</style>
<div class="composer">
      <div class="quickbar" id="quickbar">
        <button data-q="我附近有什么值得逛的景点？">📍 附近景点</button>
        <button data-q="帮我找找附近好吃的餐厅">🍜 找吃的</button>
        <button data-q="附近有什么性价比高的酒店？">🛏️ 找酒店</button>
        <button data-q="附近有什么适合逛街购物的商场？">🛍️ 买东西</button>
        <button id="fortuneBtn">🎋 今日运势</button>
      </div>
      <div class="attach-preview" id="attachPreview" hidden>
        <img id="attachThumb" alt="待识别照片" />
        <button id="attachRemove" title="移除">✕</button>
      </div>
      <div class="composer-inner">
        <button class="tool-btn" id="micBtn" title="语音输入">🎤</button>
        <button class="tool-btn" id="imgBtn" title="上传景点照片">📷</button>
        <input type="file" id="imgInput" accept="image/*" hidden />
        <textarea id="input" rows="1" placeholder="问问附近有什么商场，或上传一张景点照片让我认认～"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </main>

  <aside class="map-panel" id="mapPanel">
    <div class="map-head">
      <span>📍 位置地图</span>
      <button class="icon-btn" id="icsBtn" title="导出到手机日历(.ics)" hidden>📅</button>
      <button class="icon-btn" id="mapClose" title="收起">✕</button>
    </div>
    <div class="map-body" id="mapBody">
      <div class="map-canvas-wrap" id="mapCanvasWrap" hidden>
        <div class="map-canvas" id="mapCanvas"></div>
      </div>
      <div class="map-empty" id="mapEmpty">发送消息后，查询到的地点会在这里展示 🌍</div>
      <div class="map-count" id="mapCount" hidden></div>
      <div class="map-list" id="mapList"></div>
    </div>
  </aside>

</div>

</script>
<script>
/* 小水 · 出行决策助手（EdgeOne Makers 前端） */
(() => {
  const ENDPOINT = '/mall-agent';
  const LS_CID = 'xs_cid';
  const LS_SESSIONS = 'xs_sessions';
  const MAX_SESSIONS = 20;

  const $ = (id) => document.getElementById(id);
  const chatEl = $('chat');
  const welcomeEl = $('welcome');
  const inputEl = $('input');
  const sendBtn = $('sendBtn');
  const imgInput = $('imgInput');
  const attachPreview = $('attachPreview');
  const attachThumb = $('attachThumb');
  const mapPanel = $('mapPanel');
  const mapCanvasWrap = $('mapCanvasWrap');
  const mapEmpty = $('mapEmpty');
  const mapCount = $('mapCount');
  const mapList = $('mapList');
  const historyList = $('historyList');

  let state = {
    cid: localStorage.getItem(LS_CID) || newId(),
    sessionId: newId(),
    messages: [],
    points: [],
    pendingImage: '',
    busy: false,
    isPlan: false,
  };
  localStorage.setItem(LS_CID, state.cid);

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'cid-' + Date.now() + '-' + Math.random().toString(16).slice(2, 10);
  }

  /* ── Markdown 极简渲染 ───────────────── */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderText(text) {
    const lines = escapeHtml(text || '').split(/\r?\n/);
    let html = '';
    let inList = false;
    for (const raw of lines) {
      const line = raw.trim();
      if (/^[-*·]\s+/.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(line.replace(/^[-*·]\s+/, '')) + '</li>';
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (!line) continue;
      html += '<p>' + inline(line) + '</p>';
    }
    if (inList) html += '</ul>';
    return html;
  }

  function inline(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  /* ── 消息渲染 ─────────────────────────── */
  function hideWelcome() {
    if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
  }

  function appendMessage(role, content, image) {
    hideWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🙂' : '🧳';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (image) {
      const img = document.createElement('img');
      img.src = image;
      img.alt = '上传的照片';
      bubble.appendChild(img);
    }
    const body = document.createElement('div');
    if (role === 'assistant' && content) {
      let i = 0;
      const tick = () => {
        i = Math.min(content.length, i + 2);
        body.textContent = content.slice(0, i);
        scrollBottom();
        if (i < content.length) setTimeout(tick, 18);
        else body.innerHTML = renderText(content);
      };
      tick();
    } else {
      body.innerHTML = renderText(content);
    }
    bubble.appendChild(body);

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function appendTyping() {
    hideWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingMsg';
    wrap.innerHTML = '<div class="avatar">🧳</div>'
      + '<div class="bubble typing"><span></span><span></span><span></span></div>';
    chatEl.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const el = $('typingMsg');
    if (el) el.remove();
  }

  function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  /* ── 收藏夹 ───────────────────────────── */
  const LS_FAVS = 'xs_favs';
  const favList = $('favList');
  const favKey = (p) => `${p.name || ''}|${p.lng || ''}|${p.lat || ''}`;

  function loadFavs() {
    try { return JSON.parse(localStorage.getItem(LS_FAVS) || '[]'); }
    catch { return []; }
  }

  function saveFavs(list) {
    localStorage.setItem(LS_FAVS, JSON.stringify(list.slice(0, 50)));
    renderFavs();
  }

  function isFav(p) {
    return loadFavs().some((f) => favKey(f) === favKey(p));
  }

  function toggleFav(p, btn) {
    const list = loadFavs();
    const k = favKey(p);
    const idx = list.findIndex((f) => favKey(f) === k);
    if (idx >= 0) {
      list.splice(idx, 1);
      if (btn) { btn.textContent = '🤍'; btn.title = '收藏'; }
    } else {
      list.unshift({
        name: p.name, address: p.address, rating: p.rating,
        lng: p.lng, lat: p.lat, category: p.category, time: Date.now(),
      });
      bumpStat('fav');
      if (btn) { btn.textContent = '❤️'; btn.title = '取消收藏'; }
    }
    saveFavs(list);
  }

  function renderFavs() {
    const list = loadFavs();
    if (!list.length) {
      favList.innerHTML = '<div class="history-empty">点地点卡片上的 🤍 收藏</div>';
      return;
    }
    favList.innerHTML = list.map((f, i) => `
      <div class="history-item fav-item" data-i="${i}">
        <span class="dot">❤️</span>
        <span class="fav-name">${escapeHtml(f.name || '未命名')}</span>
        <button class="fav-del" data-i="${i}" title="删除">✕</button>
      </div>`).join('');
    favList.querySelectorAll('.fav-item').forEach((el) => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.fav-del')) return;
        const f = loadFavs()[Number(el.dataset.i)];
        if (!f) return;
        toggleMapPanel(true);
        const idx = state.points.findIndex((p) => favKey(p) === favKey(f));
        if (idx >= 0) focusPoint(idx);
        else {
          appendMessage('assistant',
            `❤️ ${f.name}：收藏于之前的对话。地址：${f.address || '未知'}`
            + (f.rating ? ` · ★ ${f.rating}` : '')
            + `\n\n重新查询这个地点就能在地图上看到它啦～`);
        }
      });
    });
    favList.querySelectorAll('.fav-del').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const list = loadFavs();
        list.splice(Number(el.dataset.i), 1);
        saveFavs(list);
        // 同步刷新卡片按钮状态
        mapList.querySelectorAll('.fav-btn').forEach((btn) => {
          const p = state.points[Number(btn.dataset.i)];
          if (p) btn.textContent = isFav(p) ? '❤️' : '🤍';
        });
      });
    });
  }

  /* ── 地图面板 ─────────────────────────── */
  const CAT_COLOR = { shopping: '#FF6B6B', hotel: '#4D96FF', sightseeing: '#2BB673' };
  const CAT_LABEL = { shopping: '商场', hotel: '酒店', sightseeing: '景点' };

  // 高德栅格瓦片（中文注记，与高德 POI 的 GCJ-02 坐标一致，无需纠偏）
  const TILE_URL = 'https://webrd0{s}.is.autonavi.com/appmaptile'
    + '?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';

  let map = null;
  const markerByIndex = new Map();
  let activeIndex = -1;

  function ensureMap() {
    if (map) return map;
    if (!window.L) return null;
    map = L.map('mapCanvas', { zoomControl: true, attributionControl: false });
    L.tileLayer(TILE_URL, {
      subdomains: ['1', '2', '3', '4'],
      minZoom: 3,
      maxZoom: 18,
    }).addTo(map);
    map.setView([34.5, 108.9], 4);
    return map;
  }

  function invalidate() {
    if (map) map.invalidateSize();
  }

  function setActive(index) {
    activeIndex = index;
    mapList.querySelectorAll('.poi-card').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
    markerByIndex.forEach((marker, i) => {
      const el = marker.getElement();
      if (!el) return;
      const pin = el.querySelector('.poi-marker');
      if (pin) pin.classList.toggle('active', i === index);
    });
  }

  function focusPoint(index) {
    const p = state.points[index];
    if (!p || !map) return;
    const lat = Number(p.lat), lng = Number(p.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    setActive(index);
    map.setView([lat, lng], 15, { animate: true });
    const marker = markerByIndex.get(index);
    if (marker) marker.openPopup();
    const card = mapList.querySelectorAll('.poi-card')[index];
    if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function buildCard(p, index) {
    const color = CAT_COLOR[p.category] || '#8a94a6';
    const label = CAT_LABEL[p.category] || '地点';
    const nameEnc = encodeURIComponent(p.name || '');
    const markerUrl = `https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${nameEnc}`;
    const navUrl = `https://uri.amap.com/navigation?to=${p.lng},${p.lat}&toname=${nameEnc}&mode=transit`;
    const addr = p.address || '地址未知';
    const extra = [];
    if (p.rating) extra.push(`★ ${p.rating}`);
    if (p.cost) extra.push(`人均 ¥${p.cost}`);
    const card = document.createElement('div');
    card.className = 'poi-card';
    card.innerHTML = `<div class="poi-pin" style="background:${color}">${label}</div>
      <div class="poi-info">
        <div class="poi-name">${escapeHtml(p.name || '未命名地点')}</div>
        <div class="poi-addr">${escapeHtml(addr)}${extra.length ? ' · ' + escapeHtml(extra.join(' · ')) : ''}</div>
        <div class="poi-links">
          <a href="${markerUrl}" target="_blank" rel="noopener">📍 高德查看</a>
          <a href="${navUrl}" target="_blank" rel="noopener">🧭 导航</a>
        </div>
      </div>
      <button class="fav-btn" data-i="${index}" title="${isFav(p) ? '取消收藏' : '收藏'}">${isFav(p) ? '❤️' : '🤍'}</button>`;
    card.querySelector('.fav-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(p, e.currentTarget);
    });
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      focusPoint(index);
    });
    return card;
  }

  function resetMapPanel(text) {
    state.points = [];
    markerByIndex.clear();
    activeIndex = -1;
    if (map) map.remove();
    map = null;
    mapCanvasWrap.hidden = true;
    mapList.innerHTML = '';
    mapCount.hidden = true;
    mapEmpty.hidden = false;
    mapEmpty.textContent = text;
  }

  function renderMap(points, isPlan) {
    const valid = (points || []).filter((p) =>
      Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng)));
    state.isPlan = !!isPlan && valid.length > 1;
    if (icsBtn) icsBtn.hidden = !state.isPlan;
    state.points = valid;
    markerByIndex.clear();
    activeIndex = -1;
    mapList.innerHTML = '';
    mapPanel.classList.remove('hidden');

    if (!valid.length) {
      if (map) map.remove();
      map = null;
      mapCanvasWrap.hidden = true;
      mapEmpty.hidden = false;
      mapEmpty.textContent = '这次没有查到带坐标的地点';
      mapCount.hidden = true;
      return;
    }

    mapEmpty.hidden = true;
    valid.forEach((p, i) => mapList.appendChild(buildCard(p, i)));
    mapCount.hidden = false;
    mapCount.textContent = `共 ${valid.length} 个地点 · 点卡片或标记可定位`;

    const instance = ensureMap();
    if (!instance) { mapCanvasWrap.hidden = true; return; }

    mapCanvasWrap.hidden = false;
    invalidate();

    const pts = valid.map((p) => [Number(p.lat), Number(p.lng)]);
    if (pts.length === 1) {
      instance.setView(pts[0], 15);
    } else {
      instance.fitBounds(L.latLngBounds(pts), { padding: [26, 26], maxZoom: 15 });
    }

    valid.forEach((p, i) => {
      const color = CAT_COLOR[p.category] || '#8a94a6';
      const icon = L.divIcon({
        className: 'poi-marker-wrap',
        html: `<div class="poi-marker" style="--c:${color}">${i + 1}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -14],
      });
      const marker = L.marker([Number(p.lat), Number(p.lng)], { icon })
        .addTo(instance)
        .bindPopup(`<div class="poi-popup"><b>${escapeHtml(p.name || '未命名地点')}</b>`
          + `<div>${escapeHtml(p.address || '地址未知')}</div></div>`);

        setActive(i);
        const card = mapList.querySelectorAll('.poi-card')[i];

      markerByIndex.set(i, marker);

  async function send() {
    if (state.busy) return;
    const text = inputEl.value.trim();
    const image = state.pendingImage;
    if (!text && !image) return;

    state.busy = true;
    sendBtn.disabled = true;
    if (image) bumpStat('spot');

    const shownText = text || '这张照片里是哪个景点？帮我看看';
    appendMessage('user', text || '（上传了一张照片）', image);
    state.messages.push({ role: 'user', content: shownText });

    inputEl.value = '';
    autoGrow();
    clearImage();
    appendTyping();

    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Makers-Conversation-Id': state.cid,
        },
        body: JSON.stringify({
          message: shownText,
          history: state.messages.slice(-9),
          image: image || undefined,
        }),
      });

      if (!res.ok) {
        const detail = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}${detail ? '：' + detail.slice(0, 120) : ''}`);
      }

      const data = await res.json();
      removeTyping();
      const reply = data.reply || '抱歉，这次没生成出回复～';
      appendMessage('assistant', reply);
      state.messages.push({ role: 'assistant', content: reply });

      if (data.points && data.points.length) renderMap(data.points, !!data.plan);
      if (data.plan) bumpStat('plan');
      saveSession();
    } catch (err) {
      removeTyping();
      const msg = `😵‍💫 请求失败了：${err.message}\n\n稍后再试一次，或刷新页面重开对话～`;
      appendMessage('assistant', msg);
    } finally {
      state.busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  /* ── 图片处理 ─────────────────────────── */
  async function compress(file) {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = dataUrl;
    });

    const MAX = 1280;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    if (scale === 1 && dataUrl.length < 900 * 1024) return dataUrl;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.85);
  }

    };
    r.onend = () => { recogOn = false; micBtn.classList.remove('recording'); };
    r.onerror = () => { recogOn = false; micBtn.classList.remove('recording'); };
    return r;
  }

  /* ── 分享卡片（Canvas 生成 PNG） ──────── */
  function wrapText(ctx, text, maxWidth) {
    const lines = [];
    for (const raw of (text || '').split(/\r?\n/)) {
      let line = '';
      for (const ch of raw) {
        if (ctx.measureText(line + ch).width > maxWidth && line) {
          lines.push(line); line = ch;
        } else line += ch;
      }
      lines.push(line);
    }
    return lines;
  }

  function shareCard() {
    const lastBot = [...state.messages].reverse().find((m) => m.role === 'assistant');
    if (!lastBot && !state.points.length) {
      alert('还没有可分享的内容，先聊点什么吧～');
      return;
    }
    const W = 750, PAD = 56;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // 先量高度
    const bodyText = (lastBot ? lastBot.content : '').slice(0, 600);
    ctx.font = '26px sans-serif';
    const bodyLines = wrapText(ctx, bodyText, W - PAD * 2);
    const poiLines = state.points.slice(0, 6)
      .map((p) => `${p.name}${p.rating ? ' ★' + p.rating : ''}`);
    const H = 200 + bodyLines.length * 40 + (poiLines.length ? poiLines.length * 40 + 90 : 0) + 90;
    canvas.width = W; canvas.height = H;

    // 背景 + 头部
    const grad = ctx.createLinearGradient(0, 0, W, 220);
    grad.addColorStop(0, '#2BB673'); grad.addColorStop(1, '#1E8FA8');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 200);
    ctx.fillStyle = '#f6f8fb'; ctx.fillRect(0, 200, W, H - 200);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('🧳 小水 · 出行决策助手', PAD, 92);
    ctx.font = '24px sans-serif';
    ctx.globalAlpha = 0.9;
    ctx.fillText(state.isPlan ? '我的行程安排' : '我的出行发现', PAD, 140);
    ctx.globalAlpha = 1;

    // 正文
    ctx.fillStyle = '#2a3342'; ctx.font = '26px sans-serif';
    bodyLines.forEach((line, i) => ctx.fillText(line, PAD, 250 + i * 40));

    // 地点清单
    let y = 250 + bodyLines.length * 40;
    if (poiLines.length) {
      y += 30;
      ctx.fillStyle = '#8a94a6'; ctx.font = '22px sans-serif';
      ctx.fillText('📍 相关地点', PAD, y); y += 44;
      ctx.fillStyle = '#2a3342'; ctx.font = '24px sans-serif';
      poiLines.forEach((line) => { ctx.fillText('· ' + line, PAD, y); y += 40; });
    }

    // 页脚
    ctx.fillStyle = '#b0b8c4'; ctx.font = '22px sans-serif';
    ctx.fillText('由「小水」生成 · 识景点 / 找商场 / 排行程', PAD, H - 40);

    const a = document.createElement('a');
    a.download = 'xiaoshui-share.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

    { key:'fav',   icon:'💝', name:'收藏家',   need:10, desc:'累计收藏 10 个地点' },
    { key:'list',  icon:'🛍️', name:'购物达人', need:10, desc:'清单累计添加 10 件' },
    { key:'voice', icon:'🎤', name:'先声夺人', need:1,  desc:'使用 1 次语音输入' },
  ];
  function loadStats() {
    try { return Object.assign({spot:0,plan:0,fav:0,list:0,voice:0},
           JSON.parse(localStorage.getItem(LS_STATS) || '{}')); }
    catch { return {spot:0,plan:0,fav:0,list:0,voice:0}; }
  }
  function bumpStat(key) {
    const st = loadStats();
    st[key] = (st[key] || 0) + 1;
    localStorage.setItem(LS_STATS, JSON.stringify(st));
    renderBadges();
  }
  function renderBadges() {
    if (!badgeList) return;
    const st = loadStats();
    badgeList.innerHTML = BADGES.map((b) => {
      const got = (st[b.key] || 0) >= b.need;
      return `<div class="history-item badge-item ${got ? '' : 'locked'}"
                   title="${b.desc}（进度 ${Math.min(st[b.key]||0,b.need)}/${b.need}）">
                <span>${b.icon}</span><b>${got ? b.name : '???'}</b>
                <span style="margin-left:auto;opacity:.7">${Math.min(st[b.key]||0,b.need)}/${b.need}</span>
              </div>`;
    }).join('');
  }

  renderHistory();
  renderFavs();
  renderList();
  renderBadges();
  bindWelcome();
  inputEl.focus();
})();

</script>

  transition: transform .18s ease;
}
#pet.thinking .pet-body {
  animation: petSpin 1.1s linear infinite;
}
#pet.happy .pet-body {
  animation: petJump .55s ease;
}
.pet-shadow {
  width: 40px; height: 8px; margin: 6px auto 0;
  border-radius: 50%; background: rgba(31,41,55,.14);
  animation: petShadow 2.6s ease-in-out infinite;
}
.pet-bubble {
  position: absolute; bottom: 86px; right: 4px;
  max-width: 190px; padding: 8px 12px;
  background: #fff; border: 1px solid var(--border);
  border-radius: 12px 12px 2px 12px;
  font-size: 12.5px; color: var(--text); line-height: 1.5;
  box-shadow: 0 4px 14px rgba(31,41,55,.12);
  white-space: pre-wrap;
}
.pet-bubble::after {
  content: ''; position: absolute; bottom: -6px; right: 16px;
  width: 10px; height: 10px; background: #fff;
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  transform: rotate(45deg);
}
@keyframes petBob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
@keyframes petShadow {
  0%,100% { transform: scaleX(1); opacity: .16; }
  50% { transform: scaleX(.72); opacity: .08; }
}
@keyframes petSpin {
  to { transform: rotate(360deg); }
}
@keyframes petJump {
  0%,100% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-14px) scale(1.06); }
  70% { transform: translateY(0) scale(.96); }
}
@media (max-width: 640px) {
  #pet { width: 58px; height: 80px; right: 14px; bottom: 110px; }
  .pet-body { width: 54px; height: 54px; }
}
</style>
<script>
(() => {
  const pet = document.getElementById('pet');
  const body = pet.querySelector('.pet-body');
  const bubble = document.getElementById('petBubble');
  let bubbleTimer = null, dragMoved = false;

  const IDLE_LINES = [
    '嗨，我是阿水 🌊',
    '发张照片，我帮你认认是哪儿！',
    '想买东西？说出预算我来参谋～',
    '要不要安排个一日游？',
    '点右上角 🖼️ 可以生成分享卡片哦',
    '累了就把我拖到舒服的位置放着～',
  ];
  const THINK_LINES = ['让我想想…🤔', '正在翻地图…', '马上就好！', '认真查找中…🔍'];

  function say(text, ms = 3200) {
    bubble.textContent = text;
    bubble.hidden = false;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { bubble.hidden = true; }, ms);
  }

  // 待机时偶尔说话
  function idleChat() {
    if (bubble.hidden && !pet.classList.contains('thinking')) {
      say(IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)]);
    }
    setTimeout(idleChat, 18000 + Math.random() * 14000);
  }
  const h = new Date().getHours();
  const greetLine = h < 5 ? '夜深了…这个点还在逛？早点休息呀 🌙'
    : h < 9 ? '早上好！今天想去哪儿转转？'
    : h < 12 ? '上午好，要不要查查附近的商场？'
    : h < 14 ? '午后犯困？查个景点提提神～'
    : h < 18 ? '下午好！发张照片我帮你认认这是哪儿'
    : h < 23 ? '晚上好，规划个周末出行？'
    : '夜猫子模式…查个酒店早点休息？';
  setTimeout(() => say(greetLine, 4200), 1800);
  setTimeout(idleChat, 9000);

  // 监听聊天区：AI 思考中 / 回复完成
  const chat = document.getElementById('chat');
  if (chat && window.MutationObserver) {
    new MutationObserver(() => {
      const typing = document.getElementById('typingMsg');
      if (typing && !pet.classList.contains('thinking')) {
        pet.classList.add('thinking');
        say(THINK_LINES[Math.floor(Math.random() * THINK_LINES.length)], 8000);
      } else if (!typing && pet.classList.contains('thinking')) {
        pet.classList.remove('thinking');
        pet.classList.add('happy');
        setTimeout(() => pet.classList.remove('happy'), 600);
      }
    }).observe(chat, { childList: true, subtree: true });
  }

  // 点击：随机台词（拖动不算）
  const EGG_LINES = [
    '🎉 恭喜发现隐藏彩蛋！',
    '其实我是 Mall-Agent 的首席代言官…',
    '再点也不会变出萧逸本尊的（笑）',
    '你是我见过最有耐心的用户！',
    '彩蛋收集家就是你没错了 🏅',
  ];
  let eggCount = 0;
  pet.addEventListener('click', () => {
    if (dragMoved) { dragMoved = false; return; }
    if (!pet.classList.contains('thinking')) {
      eggCount++;
      if (eggCount >= 10) {
        eggCount = 0;
        pet.classList.add('egg');
        say(EGG_LINES[Math.floor(Math.random() * EGG_LINES.length)], 5000);
        setTimeout(() => pet.classList.remove('egg'), 1800);
      } else {
        say(IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)]);
        body.style.transform = 'scale(1.12)';
        setTimeout(() => { body.style.transform = ''; }, 200);
      }
    }
  });

  // 拖拽
  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  pet.addEventListener('pointerdown', (e) => {
    dragging = true; dragMoved = false;
    sx = e.clientX; sy = e.clientY;
    const r = pet.getBoundingClientRect();
    ox = r.left; oy = r.top;
    pet.setPointerCapture(e.pointerId);
  });
  pet.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) dragMoved = true;
    pet.style.left = Math.max(4, ox + dx) + 'px';
    pet.style.top = Math.max(4, oy + dy) + 'px';
    pet.style.right = 'auto'; pet.style.bottom = 'auto';
  });
  pet.addEventListener('pointerup', () => { dragging = false; });
})();
</script>
